# Base Application Configuration
# Use profiles: 
#   --spring.profiles.active=dev (for local development)
#   --spring.profiles.active=server (for Linux server with Angular dev server)
#   --spring.profiles.active=prod (for production with domain/HTTPS - future use)
spring.application.name=billing-backend

# Default profile (can be overridden)
spring.profiles.active=server

# Log files directory for logback-spring.xml (billing.log, billing-dev.log, etc.)
billing.log.directory=logs

# UI: year dropdown range for Collection / Accounting filters (current year ± N)
app.ui.collection-year-range-past=5
app.ui.collection-year-range-future=5

# Pincode lookup URL (server-side). On srini network Zscaler may block api.postalpincode.in;
# the Angular app also calls that API from the browser. Override if InfoSec provides an internal mirror.
app.pincode.lookup-base-url=https://api.postalpincode.in/pincode/