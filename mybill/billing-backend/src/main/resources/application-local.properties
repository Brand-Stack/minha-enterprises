# ===========================================
# Local Client Deployment Configuration
# Profile: local (for end-user installation)
# ===========================================
# 
# This profile is used for local/single-port deployment
# (e.g. running the JAR with embedded frontend from a folder).
#
# Usage: java -jar billing.jar --spring.profiles.active=local
# ===========================================

# Application
spring.application.name=Billing Application

# Log files next to the JAR / working directory (logback-spring.xml)
billing.log.directory=./logs

# MongoDB Configuration (Local - Default installation)
# Client must have MongoDB installed and running on default port
spring.data.mongodb.uri=mongodb://localhost:27017/billing_db
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.database=billing_db

# Server Configuration
# Application runs on port 1104 (single port for both API and frontend)
server.port=1104
# No context path - ApiPrefixFilter handles /api/* routing
# This allows frontend at root (/) and API at /api/*
server.servlet.context-path=

# Frontend Static Files Location
# Path relative to the installation directory
app.frontend.path=./frontend

# CORS Configuration (Not needed in local mode - same origin)
# But keeping it for any local testing scenarios
cors.allowed-origins=http://localhost:1104,http://127.0.0.1:1104

# Logging Configuration
logging.level.root=INFO
logging.level.com.app.billing=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=./logs/billing.log

# JWT Configuration
jwt.secret=MySecretKeyForJWTTokenGenerationAndValidation2024EnterpriseBillingApplication
jwt.expiration=86400000

# Swagger/OpenAPI Configuration (Disabled in local deployment for security)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ===========================================
# Security Notes:
# - JWT secret should be changed per installation for better security
# - MongoDB can be secured with authentication if needed
# ===========================================
