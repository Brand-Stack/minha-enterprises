# Development Environment Configuration
# Profile: dev (local development)

# Application
spring.application.name=billing-backend

# MongoDB Configuration (Local)
spring.data.mongodb.uri=mongodb://fxstar:fxstar@localhost:27017/billing_db?authSource=admin
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.database=billing_db

# Security (Development)
spring.security.user.name=admin
spring.security.user.password=admin123

# Server Configuration
server.port=1104
server.servlet.context-path=/api

# CORS Configuration (Development - Allow localhost, 127.0.0.1, and LAN access e.g. from another PC)
# Add more origins as needed: http://YOUR_IP:4200 (no trailing slash)
cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200,http://192.168.1.15:4200,http://minhaenterprises.in,https://minhaenterprises.in,http://www.minhaenterprises.in,https://www.minhaenterprises.in,https://my-app.brandstack.in,http://my-app.brandstack.in

# Logging (Development - console + files via logback-spring.xml: logs/billing.log and logs/billing-dev.log)
logging.level.root=INFO
logging.level.com.app.billing=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
# billing.log.directory is read by logback-spring.xml (default logs/ under process working directory)
billing.log.directory=logs

# JWT Configuration
jwt.secret=MySecretKeyForJWTTokenGenerationAndValidation2024EnterpriseBillingApplication
jwt.expiration=86400000

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

