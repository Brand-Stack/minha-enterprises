# Production Environment Configuration
# Profile: prod (server deployment)

# Application
spring.application.name=billing-backend

# MongoDB Configuration (Production)
# IMPORTANT: Update with your production MongoDB connection string
spring.data.mongodb.uri=${MONGODB_URI:mongodb://fxstar:fxstar@localhost:27017/billing_db?authSource=admin}
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.database=${MONGODB_DATABASE:billing_db}

# Security (Production)
# IMPORTANT: Change these credentials in production
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin123}

# Server Configuration
server.port=1104
server.servlet.context-path=/api
# HTTPS Configuration (when behind reverse proxy)
server.forward-headers-strategy=framework

# CORS Configuration (Production - Allow production domain)
# Note: This is for future use when domain is configured
cors.allowed-origins=https://www.billingapplication.com,https://billingapplication.com

# Logging (Production - File focused)
logging.level.root=INFO
logging.level.com.app.billing=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=/var/log/billing-app/billing.log
logging.file.max-size=10MB
logging.file.max-history=30

# JWT Configuration (Production - Use environment variable)
jwt.secret=${JWT_SECRET:MySecretKeyForJWTTokenGenerationAndValidation2024EnterpriseBillingApplication}
jwt.expiration=86400000

# Swagger/OpenAPI Configuration (Disabled in production for security)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=false

