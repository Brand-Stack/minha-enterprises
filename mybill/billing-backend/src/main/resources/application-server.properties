# Server Environment Configuration
# Profile: server (Linux server deployment - Angular dev server on port 4200)

# Application
spring.application.name=billing-backend

# MongoDB Configuration (Server)
# IMPORTANT: Update with your server MongoDB connection string
spring.data.mongodb.uri=${MONGODB_URI:mongodb://billing_user:billing_pass@localhost:27017/billing_db?authSource=admin}
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.database=${MONGODB_DATABASE:billing_db}

# Security (Server)
# IMPORTANT: Change these credentials in production
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin123}

# Server Configuration
server.port=1104
server.address=0.0.0.0
server.servlet.context-path=/api
# No HTTPS configuration - running on HTTP
# server.address=0.0.0.0 ensures backend listens on all network interfaces

# CORS Configuration (Server - Allow localhost:4200, 127.0.0.1:4200, and server IPs/domains)
cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200,http://103.235.106.107:4200,http://103.235.106.107,http://103.235.105.23:4200,http://103.235.105.23,http://billing.minhaenterprises.in,https://billing.minhaenterprises.in,http://minhaenterprises.in,https://minhaenterprises.in,http://www.minhaenterprises.in,https://www.minhaenterprises.in,https://my-app.brandstack.in,http://my-app.brandstack.in

# Logging (Server - File focused)
logging.level.root=INFO
logging.level.com.app.billing=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=/var/log/billing-app/billing.log
logging.file.max-size=10MB
logging.file.max-history=30

# JWT Configuration (Server - Use environment variable)
jwt.secret=${JWT_SECRET:MySecretKeyForJWTTokenGenerationAndValidation2024EnterpriseBillingApplication}
jwt.expiration=86400000

# Swagger/OpenAPI Configuration (Enabled for server development)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

