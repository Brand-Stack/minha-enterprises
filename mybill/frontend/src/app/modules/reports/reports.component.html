<div class="reports-page">
  <header class="reports-header-card rpt-fade">
    <div class="header-left">
      <div class="header-icon-box">
        <mat-icon>assessment</mat-icon>
      </div>
      <div>
        <h1 class="reports-title">Reports & Audit Center</h1>
        <p class="reports-sub">View, search, filter, and audit billing records across all modules in real time.</p>
      </div>
    </div>
  </header>

  <mat-card class="reports-card rpt-fade">
    <mat-tab-group
      [(selectedIndex)]="selectedTabIndex"
      (selectedIndexChange)="onTabChange($event)"
      class="reports-tabs"
      animationDuration="220ms">
      <mat-tab>
        <ng-template mat-tab-label>
          <mat-icon class="tab-icon">receipt_long</mat-icon>
          <span>Client Entry Report</span>
        </ng-template>
        <div class="tab-body-pad">
          <app-courier-report></app-courier-report>
        </div>
      </mat-tab>
      <mat-tab>
        <ng-template mat-tab-label>
          <mat-icon class="tab-icon">local_shipping</mat-icon>
          <span>Customer Collection</span>
        </ng-template>
        <div class="tab-body-pad">
          <app-customer-collection-report></app-customer-collection-report>
        </div>
      </mat-tab>
      <mat-tab>
        <ng-template mat-tab-label>
          <mat-icon class="tab-icon">point_of_sale</mat-icon>
          <span>Cash Booking</span>
        </ng-template>
        <div class="tab-body-pad">
          <app-cash-booking-report></app-cash-booking-report>
        </div>
      </mat-tab>
      <mat-tab>
        <ng-template mat-tab-label>
          <mat-icon class="tab-icon">inventory_2</mat-icon>
          <span>Small Client Entry</span>
        </ng-template>
        <div class="tab-body-pad">
          <app-small-client-entry-report></app-small-client-entry-report>
        </div>
      </mat-tab>
    </mat-tab-group>
  </mat-card>
</div>
