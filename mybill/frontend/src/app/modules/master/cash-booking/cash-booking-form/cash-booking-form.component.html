<div class="cbf-page">
  <div class="cbf-head">
    <h1>{{ id ? 'Edit' : 'Create' }} Cash Booking</h1>
  </div>

  <mat-card>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="save()">
        <h2 class="cbf-sec">Shipment details</h2>
        <div class="cbf-grid">
          <mat-form-field appearance="outline">
            <mat-label>Date</mat-label>
            <input matInput [matDatepicker]="dp" formControlName="bookingDate" />
            <mat-datepicker-toggle matSuffix [for]="dp"></mat-datepicker-toggle>
            <mat-datepicker #dp></mat-datepicker>
          </mat-form-field>
          <mat-form-field appearance="outline" class="cbf-span-2">
            <mat-label>Receiver name *</mat-label>
            <input matInput formControlName="receiverName" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Pincode *</mat-label>
            <input matInput formControlName="pincode" maxlength="16" (input)="onPincodeInput()" />
            <span matSuffix *ngIf="pincodeLoading"><mat-progress-spinner diameter="20" mode="indeterminate"></mat-progress-spinner></span>
            <mat-error *ngIf="form.get('pincode')?.errors?.['invalidPincode']">Invalid pincode</mat-error>
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>State</mat-label>
            <input matInput formControlName="state" [readonly]="stateLocked" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>City</mat-label>
            <input matInput formControlName="city" [readonly]="cityLocked" />
          </mat-form-field>
          <mat-form-field appearance="outline" *ngIf="pincodeAreaOptions.length > 1; else cbfAreaSingle">
            <mat-label>Area name</mat-label>
            <mat-select formControlName="areaName" (selectionChange)="onAreaSelected()">
              <mat-option value="">Select area</mat-option>
              <mat-option *ngFor="let a of pincodeAreaOptions" [value]="a">{{ a }}</mat-option>
            </mat-select>
          </mat-form-field>
          <ng-template #cbfAreaSingle>
            <mat-form-field appearance="outline">
              <mat-label>Area name</mat-label>
              <input matInput formControlName="areaName" [readonly]="areaLocked" />
            </mat-form-field>
          </ng-template>
          <mat-form-field appearance="outline" class="cbf-span-2">
            <mat-label>Full address</mat-label>
            <textarea matInput formControlName="fullAddress" rows="2"></textarea>
          </mat-form-field>
        </div>

        <h2 class="cbf-sec">Courier line</h2>
        <div class="cbf-grid">
          <mat-form-field appearance="outline">
            <mat-label>AWB No</mat-label>
            <input matInput formControlName="awbNo" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Courier</mat-label>
            <input matInput formControlName="courier" [matAutocomplete]="courAuto" (input)="onCourierFilter($event)" />
            <mat-autocomplete #courAuto="matAutocomplete">
              <mat-option *ngFor="let c of filteredCouriers" [value]="c">{{ c }}</mat-option>
            </mat-autocomplete>
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Weight (kg)</mat-label>
            <input matInput type="number" formControlName="weight" class="no-spin" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Item</mat-label>
            <input matInput formControlName="item" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Status</mat-label>
            <input matInput formControlName="status" [matAutocomplete]="stAuto" (input)="onStatusFilter($event)" />
            <mat-autocomplete #stAuto="matAutocomplete">
              <mat-option *ngFor="let s of filteredStatuses" [value]="s">{{ s }}</mat-option>
            </mat-autocomplete>
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Amount</mat-label>
            <input matInput type="number" formControlName="amount" class="no-spin" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Amount status</mat-label>
            <input
              matInput
              formControlName="amountStatus"
              [matAutocomplete]="amtStAuto"
              (input)="onAmountStatusFilter($event)"
              placeholder="Choose or type"
            />
            <mat-autocomplete #amtStAuto="matAutocomplete">
              <mat-option *ngFor="let s of filteredAmountStatuses" [value]="s">{{ s }}</mat-option>
            </mat-autocomplete>
          </mat-form-field>
          <mat-form-field appearance="outline" class="cbf-span-2">
            <mat-label>Remarks</mat-label>
            <textarea matInput formControlName="remarks" rows="2"></textarea>
          </mat-form-field>
        </div>

        <app-last-updated-by-field *ngIf="id" [value]="lastUpdatedBy"></app-last-updated-by-field>

        <div class="cbf-actions">
          <button mat-button type="button" (click)="cancel()">Cancel</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || saving">
            <mat-spinner *ngIf="saving" diameter="20"></mat-spinner>
            <span *ngIf="!saving">Save</span>
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
